<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoppingCart | Create account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">ShoppingCart</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="Shop/index.html" data-auth-only hidden>Shop</a>
            <a href="cart/index.html" data-auth-only hidden>My Cart</a>
            <a href="profile/index.html" data-auth-only hidden>Profile</a>
            <a href="Shop/login.html" data-guest-only>Login</a>
            <a class="active" href="index.html" data-guest-only>Sign Up</a>
            <button class="button secondary small-btn" type="button" data-auth-only data-logout data-home="index.html" hidden>Logout</button>
        </nav>
    </header>

    <main class="auth-layout">
        <section class="auth-card">
            <h1>Create your account</h1>
            <p class="muted">Sign up to start shopping with ShoppingCart.</p>

            <form id="signup-form" onsubmit="return false;">
                <label for="fname">First name</label>
                <input type="text" id="fname" name="fname" autocomplete="given-name" placeholder="First name" required>

                <label for="lname">Last name</label>
                <input type="text" id="lname" name="lname" autocomplete="family-name" placeholder="Last name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>

                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" placeholder="Enter your password again" required>

                <p id="error" class="form-message" aria-live="polite"></p>
                <button class="button primary full" type="button" id="signup">Create account</button>
            </form>

            <p class="form-foot">Already have an account? <a href="Shop/login.html">Log in</a></p>
        </section>

        <aside class="auth-art">
            <img src="images/landingPagePic.png" alt="Shopping bags and a storefront">
            <h2>Find something you'll love.</h2>
            <p>Create an account to get started with ShoppingCart.</p>
        </aside>
    </main>

    <script src="auth.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
