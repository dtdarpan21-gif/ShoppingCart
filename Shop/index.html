<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoppingCart | Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="shop-page">
    <header class="shop-nav">
        <a class="brand" href="../index.html">ShoppingCart</a>
        <nav class="nav-items" aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="index.html" data-auth-only hidden>Shop</a>
            <a href="../cart/index.html" data-auth-only hidden>My Cart</a>
            <a href="../profile/index.html" data-auth-only hidden>Profile</a>
            <button class="button secondary small-btn" type="button" data-auth-only data-logout data-home="../index.html" hidden>Logout</button>
        </nav>
    </header>

    <main class="shop-layout">
        <aside class="filters" aria-label="Product filters">
            <div class="filter-heading"><h2>Filters</h2></div>
            <section class="filter-group">
                <h3>Price range</h3>
                <div class="price-inputs">
                    <label for="min-price">Min ($)</label>
                    <input id="min-price" type="number" min="0" step="1" placeholder="0">
                    <label for="max-price">Max ($)</label>
                    <input id="max-price" type="number" min="0" step="1" placeholder="No limit">
                </div>
            </section>
            <section class="filter-group">
                <h3>Minimum rating</h3>
                <label class="rating-control" for="min-rating"><span id="rating-value">0</span> stars and up</label>
                <input id="min-rating" type="range" min="0" max="5" step="0.5" value="0">
            </section>
            <button class="button primary full" id="applyFilters" type="button">Apply Filters</button>
        </aside>

        <section class="shop-content" aria-label="Products">
            <div class="catalog-heading">
                <div><h1>Shop</h1><p>Find something you'll love.</p></div>
                <label class="sort-control" for="sort-products">Sort by
                    <select id="sort-products">
                        <option value="featured">Featured</option>
                        <option value="price-asc">Price: low to high</option>
                        <option value="price-desc">Price: high to low</option>
                        <option value="rating-desc">Top rated</option>
                        <option value="title-asc">Name: A to Z</option>
                    </select>
                </label>
            </div>

            <div class="catalog-tools">
                <input class="field search-wrap" id="search-products" type="search" placeholder="Search products" aria-label="Search products">
                <div class="category-filters" role="group" aria-label="Product categories">
                    <button class="filter active" type="button" data-category="all" aria-pressed="true">All</button>
                    <button class="filter" type="button" data-category="men's clothing" aria-pressed="false">Mens</button>
                    <button class="filter" type="button" data-category="women's clothing" aria-pressed="false">Womens</button>
                    <button class="filter" type="button" data-category="jewelery" aria-pressed="false">Jewellery</button>
                    <button class="filter" type="button" data-category="electronics" aria-pressed="false">Electronics</button>
                </div>
            </div>

            <p id="shop-message" class="shop-message" aria-live="polite"></p>
            <div id="product-grid" class="product-grid"></div>
        </section>
    </main>

    <script src="../auth.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
