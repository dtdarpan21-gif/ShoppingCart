<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoppingCart | Log in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <header class="login-nav">
        <a class="login-brand" href="../index.html">Shopping Cart</a>
        <nav aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="../index.html" data-guest-only>Sign Up</a>
            <a href="index.html" data-auth-only hidden>Shop</a>
            <a href="../cart/index.html" data-auth-only hidden>My Cart</a>
            <a href="../profile/index.html" data-auth-only hidden>Profile</a>
            <button class="login-nav-logout" type="button" data-auth-only data-logout data-home="../index.html" hidden>Logout</button>
        </nav>
    </header>

    <main class="login-layout">
        <section class="login-card" aria-labelledby="login-heading">
            <h1 id="login-heading">Welcome Back</h1>
            <p class="login-subtitle">Log in to continue shopping.</p>

            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>

                <button class="login-button" type="submit" id="login">Log In</button>
                <p class="form-message" id="login-message" aria-live="polite"></p>
            </form>

            <p class="login-signup" data-guest-only>New to ShoppingCart? <a href="../index.html">Create an account.</a></p>
        </section>

        <aside class="login-illustration">
            <img src="../images/landingPagePic.png" alt="Shopping bags and a storefront">
            <h2>Your Next Great Find Is Waiting.</h2>
            <p>Sign in to pick up where you left off.</p>
        </aside>
    </main>

    <script src="../auth.js" defer></script>
    <script src="login.js" defer></script>
</body>
</html>
